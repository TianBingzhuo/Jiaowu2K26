[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/adapters-sqlite",
    "crates/api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
repository = "https://github.com/TianBingzhuo/Jiaowu2K26"
publish = false

[workspace.dependencies]
async-trait = "=0.1.91"
axum = "=0.8.9"
http-body-util = "=0.1.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.0", features = ["cors", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "=1.24.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "symbols"
