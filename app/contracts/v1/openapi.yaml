        '201':
          description: Student-approved questions and evidence; no mentor response is fabricated.
        '422':
          $ref: '#/components/responses/Error'
  /campus-life/notifications:
    put:
      operationId: updateCampusLifeNotifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - enabled_categories
                - frequency
                - quiet_hours
                - marketing_enabled
              properties:
                enabled_categories:
                  type: array
                  uniqueItems: true
                  items: { type: string }
                frequency:
                  enum: [realtime, daily_digest, weekly]
                quiet_hours: { type: string, minLength: 1 }
                marketing_enabled: { type: boolean }
      responses:
        '200':
          description: Emergency alerts stay separate while non-emergency categories remain student controlled.
        '422':
          $ref: '#/components/responses/Error'
  /campus-life/corrections:
    post:
      operationId: reportCampusLifeSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_id, reason]
              properties:
                target_id: { type: string, minLength: 1 }
                reason: { type: string, minLength: 8 }
      responses:
        '202':
          description: Versioned expiry or accuracy report awaiting human review.
        '422':
          $ref: '#/components/responses/Error'
  /campus-life/receipts:
    post:
      operationId: createCampusLifeReceipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_id, participation, reflection]
              properties:
                target_id: { type: string }
                participation:
                  enum: [attended, not_attended, unknown]
                reflection: { type: string }
      responses:
        '201':
          description: Optional private footprint receipt with no participation-value score.
        '422':
          $ref: '#/components/responses/Error'
  /campus-life/mycourt/export:
    post:
      operationId: exportCampusLifeMyCourt
      responses:
        '200':
          description: Readable private and explicitly untrusted MyCOURT archive.
  /campus-life/escalation-routes:
    get:
      operationId: getCampusLifeEscalationRoutes
      responses:
        '200':
          description: Direct sourced official help routes; Fixture URLs never impersonate real emergency contacts.
  /campus-life/replay:
    get:
      operationId: getCampusLifeReplay
      responses:
        '200':
          description: Append-only profile, search, calendar, route, team, mentor, notification, correction, and receipt replay.
  /demo/campus-life:
    get:
      operationId: getDemoCampusLife
      responses:
        '200':
          description: Complete sanitized F-008 Fixture with all fourteen feature boundaries.
          content:
            application/json:
              schema:
                $ref: './campus-life-fixture.schema.json'
  /demo/campus-life/reset:
    post:
      operationId: resetDemoCampusLife
      responses:
        '200':
          description: Reset only the in-memory Campus Life Fixture session for repeatable QA.
          content:
            application/json:
              schema:
                $ref: './campus-life-session.schema.json'
  /campus-pass:
    get:
      operationId: getCampusPass
      responses:
        '200':
          description: Complete F-010 Fixture wallet, authority boundaries, session and zero-official-action box score.
  /campus-pass/credentials/{credential_id}/select:
    put:
      operationId: selectCampusPassCredential
      parameters:
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Select a wallet item locally without issuing or modifying a source credential.
        '422':
          $ref: '#/components/responses/Error'
  /campus-pass/credentials/{credential_id}/present:
    post:
      operationId: presentCampusPassCredential
      parameters:
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [carrier, static_capture]
              properties:
                carrier:
                  enum: [physical_card, nfc, dynamic_qr, mobile]
                static_capture:
                  type: boolean
      responses:
        '201':
          description: Local Fixture Reader result; official_access_granted always remains false.
        '422':
          $ref: '#/components/responses/Error'
  /campus-pass/access-requests:
    post:
      operationId: createCampusPassAccessRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential_id, zone_id, purpose]
              properties:
                credential_id:
                  type: string
                zone_id:
                  type: string
                purpose:
                  type: string
                  minLength: 4
      responses:
        '201':
          description: Non-authoritative request mirror with explicit prerequisite blockers.
        '422':
          $ref: '#/components/responses/Error'
  /campus-pass/access-requests/{request_id}/mirror:
    put:
      operationId: updateCampusPassAccessRequestMirror
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  enum: [submitted, reviewing, approved, externally_executed, denied, expired, fault, appeal]
      responses:
        '200':
          description: Fixture authority-mirror state update that never executes access.
        '422':
          $ref: '#/components/responses/Error'
  /campus-pass/guest-drafts:
    post:
      operationId: createCampusPassGuestDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [zone_id, purpose, sponsor_label, duration_hours]
              properties:
                zone_id:
                  type: string
                purpose:
                  type: string
                  minLength: 4
                sponsor_label:
                  type: string
                  minLength: 2
                duration_hours:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Purpose-bound, sponsored and auto-expiring guest draft; no pass is issued.
        '422':
          $ref: '#/components/responses/Error'
  /campus-pass/loss-cases:
    post:
      operationId: createCampusPassLossCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential_id, requested_action]
              properties:
                credential_id:
                  type: string
                requested_action:
                  enum: [freeze, report_lost, restore]
      responses:
        '201':
          description: Official-channel handoff preparation; the experience layer does not freeze, revoke or restore.
        '422':
          $ref: '#/components/responses/Error'
  /campus-pass/offline-checks:
    post:
      operationId: checkCampusPassOfflineCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential_id, zone_id, carrier]
              properties:
                credential_id:
                  type: string
                zone_id:
                  type: string
                carrier:
                  enum: [physical_card, nfc, mobile]
      responses:
        '201':
          description: Bounded freshness/scope Fixture result; no real signature or door validation claim.
        '422':
          $ref: '#/components/responses/Error'
  /campus-pass/access-log-corrections:
    post:
      operationId: correctCampusPassAccessLog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [record_id, reason]
              properties:
                record_id:
                  type: string
                reason:
                  type: string
                  minLength: 8
      responses:
        '201':
          description: Append-only correction request without rewriting the authority record.
        '422':
          $ref: '#/components/responses/Error'
  /campus-pass/manual-fallbacks:
    post:
      operationId: chooseCampusPassManualFallback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fallback_id, reason]
              properties:
                fallback_id:
                  type: string
                reason:
                  type: string
                  minLength: 4
      responses:
        '201':
          description: No-phone accessible handoff preparation; access remains external.
        '422':
          $ref: '#/components/responses/Error'
  /campus-pass/emergency-modes:
    get:
      operationId: getCampusPassEmergencyModes
      responses:
        '200':
          description: Sourced authority status; emergency execution stays in the official safety system.
  /campus-pass/access-records:
    get:
      operationId: getCampusPassSelfAccessRecords
      responses:
        '200':
          description: Necessary self-only access records with retention and correction metadata.
  /campus-pass/replay:
    get:
      operationId: getCampusPassReplay
      responses:
        '200':
          description: Append-only wallet, credential test, request, loss, offline, correction and fallback replay.
  /demo/campus-pass:
    get:
      operationId: getDemoCampusPass
      responses:
        '200':
          description: Complete sanitized F-010 Fixture with all fourteen feature boundaries.
          content:
            application/json:
              schema:
                $ref: './campus-pass-fixture.schema.json'
  /demo/campus-pass/reset:
    post:
      operationId: resetDemoCampusPass
      responses:
        '200':
          description: Reset only the in-memory Campus Pass Fixture session for repeatable QA.
          content:
            application/json:
              schema:
                $ref: './campus-pass-session.schema.json'
  /generated-objects/{object_id}:
    get:
      operationId: getGeneratedObject
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: Current object snapshot.
          content:
            application/json:
              schema:
                $ref: './generated-object.schema.json'
        '404':
          $ref: '#/components/responses/Error'
  /generated-objects/{object_id}/reviews:
    post:
      operationId: reviewGeneratedObject
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './review-request.schema.json'
      responses:
        '200':
          description: Object and append-only review event.
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /generated-objects/{object_id}/publish:
    post:
      operationId: publishGeneratedObject
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './publish-request.schema.json'
      responses:
        '200':
          description: Object and immutable published version.
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /generated-objects/{object_id}/replay:
    get:
      operationId: getEvidenceReplay
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: Current object plus ordered review, publication, and student interaction history.
  /generated-objects/{object_id}/interactions:
    post:
      operationId: recordStudentInteraction
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './interaction-request.schema.json'
      responses:
        '200':
          description: Append-only student interaction linked to the current published version.
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
components:
  parameters:
    ObjectId:
      name: object_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    CourseId:
      name: course_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ExamId:
      name: exam_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    PlanId:
      name: plan_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^ds-'
    RecordId:
      name: record_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^nr-'
    ConflictId:
      name: conflict_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^conf-'
    PerformanceEvidenceId:
      name: evidence_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^ev-'
    PerformanceRecommendationId:
      name: recommendation_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^rec-'
    PerformanceGrantId:
      name: grant_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^share-grant-'
    OpportunityId:
      name: opportunity_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^opp-'
    OpportunityDisclosureId:
      name: grant_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^disclosure-'
    OpportunityPathwayId:
      name: pathway_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^path-'
  responses:
    Error:
      description: Machine-readable error.
      content:
        application/json:
          schema:
            $ref: './error-response.schema.json'
