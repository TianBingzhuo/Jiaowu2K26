openapi: 3.1.0
info:
  title: University2K26 Phase 0 API
  version: 1.0.0-experimental
  description: >-
    Fixture-only technical validation for SmartCourse, MyCareer, Academic
    Mirror, Roster Lab, World Exam Finals, and the private Performance Center.
    It is not a production school-system contract or a completed-product claim.
servers:
  - url: http://127.0.0.1:3000/api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Local component is available.
  /ai/status:
    get:
      operationId: getAiGatewayStatus
      description: >-
        Reports provider, model and configuration state without returning a
        credential, token, authorization header or secret value.
      responses:
        '200':
          description: Safe AI gateway status.
          content:
            application/json:
              schema:
                $ref: './ai-status.schema.json'
  /ai/advice:
    post:
      operationId: createSourceBoundAiAdvice
      description: >-
        Produces source-bound, non-authoritative advice. If the configured
        model is unavailable, the response explicitly uses rules_fallback and
        never pretends a model ran.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './ai-advice-request.schema.json'
      responses:
        '200':
          description: Model output or an explicitly labelled rules fallback.
          content:
            application/json:
              schema:
                $ref: './ai-advice.schema.json'
        '422':
          $ref: '#/components/responses/Error'
  /profile/development-context:
    get:
      operationId: getLocalDevelopmentContext
      description: >-
        Returns a locally configured, de-identified evidence profile. The
        default file is Git-ignored and never contains direct identifiers.
      responses:
        '200':
          description: Local private context or an explicit unconfigured state.
  /career/current-semester:
    get:
      operationId: getCurrentCareerSemester
      responses:
        '200':
          description: Current fixture semester metadata.
  /career/current-semester/courses:
    get:
      operationId: getCurrentCareerCourses
      responses:
        '200':
          description: Current fixture course roster.
  /career/dashboard:
    get:
      operationId: getCareerDashboard
      responses:
        '200':
          description: Current season, deadlines, and recent activity summary.
  /career/course/{course_id}:
    get:
      operationId: getCareerCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Course details and optional F-001 jump target.
          content:
            application/json:
              schema:
                $ref: './career-course-detail.schema.json'
        '404':
          $ref: '#/components/responses/Error'
  /demo/semester:
    get:
      operationId: getDemoSemester
      responses:
        '200':
          description: Full, explicitly labelled F-002 fixture.
          content:
            application/json:
              schema:
                $ref: './career-fixture.schema.json'
  /demo/dashboard:
    get:
      operationId: getDemoDashboard
      responses:
        '200':
          description: Fixture dashboard for offline and fallback validation.
  /exams:
    get:
      operationId: getExamCalendar
      responses:
        '200':
          description: Private calendar of fixture exam events; formal status is explicit.
  /exams/{exam_id}:
    get:
      operationId: getExamDetail
      parameters:
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Fixture event, privacy boundary, and current private session.
        '404':
          $ref: '#/components/responses/Error'
  /exams/{exam_id}/briefing:
    get:
      operationId: getExamBriefing
      parameters:
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Scope, F-001 source locators, resources, and non-predictive readiness.
  /exams/{exam_id}/playbook:
    get:
      operationId: getExamPlaybook
      parameters:
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Review sections containing only declared F-001 generated-object IDs.
  /exams/{exam_id}/warmup:
    get:
      operationId: getExamWarmup
      parameters:
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Low-risk warm-up question with source IDs.
  /exams/{exam_id}/warmup/attempts:
    post:
      operationId: recordWarmupAttempt
      parameters:
        - $ref: '#/components/parameters/ExamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [answer]
              properties:
                answer: { type: string, minLength: 1 }
      responses:
        '200':
          description: Retryable warm-up result with no formal-grade impact.
        '422':
          $ref: '#/components/responses/Error'
  /exams/{exam_id}/warmup/skip:
    post:
      operationId: skipWarmup
      parameters:
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Warm-up skipped without restricting review resources.
  /exams/{exam_id}/checkpoints:
    post:
      operationId: saveExamCheckpoint
      parameters:
        - $ref: '#/components/parameters/ExamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [item_id, completed]
              properties:
                item_id: { type: string, minLength: 1 }
                completed: { type: boolean }
      responses:
        '200':
          description: Private, source-linked review checkpoint.
        '422':
          $ref: '#/components/responses/Error'
  /exams/{exam_id}/attempts:
    post:
      operationId: submitExamAnswer
      parameters:
        - $ref: '#/components/parameters/ExamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - question_id
                - response
                - source_checked
              properties:
                question_id: { type: string, minLength: 1 }
                response: { type: string, minLength: 1 }
                source_checked: { type: boolean }
                challenged_claim_ids:
                  type: array
                  items: { type: string, minLength: 1 }
      responses:
        '200':
          description: Private answer linked to question sources and challenged AI claims.
        '422':
          $ref: '#/components/responses/Error'
  /exams/{exam_id}/attempts/complete:
    post:
      operationId: completeExamAttempt
      parameters:
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Completed evidence-aware fixture attempt entering private review.
        '422':
          $ref: '#/components/responses/Error'
  /exams/{exam_id}/replay:
    get:
      operationId: getExamReplay
      parameters:
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Stable event replay with source-linked answers and actions.
        '409':
          $ref: '#/components/responses/Error'
  /exams/{exam_id}/box-score:
    get:
      operationId: getPrivateExamBoxScore
      parameters:
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Student-private completion and error signals without ranking or grade prediction.
  /exams/{exam_id}/reflection:
    put:
      operationId: savePrivateExamReflection
      parameters:
        - $ref: '#/components/parameters/ExamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - worked
                - blocked
                - next_adjustment
                - share_with_mentor
              properties:
                worked: { type: string, minLength: 1 }
                blocked: { type: string, minLength: 1 }
                next_adjustment: { type: string, minLength: 1 }
                share_with_mentor: { type: boolean }
                share_expires_at: { type: [string, 'null'], format: date }
                archive: { type: boolean, default: false }
      responses:
        '200':
          description: Private reflection; mentor sharing requires explicit expiring consent.
        '422':
          $ref: '#/components/responses/Error'
  /demo/world-exam:
    get:
      operationId: getDemoWorldExam
      responses:
        '200':
          description: Complete, explicitly non-formal F-005 fixture.
          content:
            application/json:
              schema:
                $ref: './world-exam-fixture.schema.json'
  /demo/world-exam/reset:
    post:
      operationId: resetDemoWorldExam
      responses:
        '200':
          description: Reset only the in-memory fixture session for repeatable local QA.
          content:
            application/json:
              schema:
                $ref: './world-exam-session.schema.json'
  /roster/prefix:
    get:
      operationId: getRosterPrefix
      responses:
        '200':
          description: Current fixture degree-progress prefix and planned selections.
    put:
      operationId: replaceRosterPrefix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Full RosterPrefix object obtained from the fixture or previous GET.
      responses:
        '200':
          description: Validated replacement prefix with an incremented version.
        '422':
          $ref: '#/components/responses/Error'
  /roster/pins:
    put:
      operationId: replaceRosterPins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [active_pin_ids]
              properties:
                active_pin_ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, pattern: '^pin-' }
      responses:
        '200':
          description: Active, validated fixture constraints.
        '422':
          $ref: '#/components/responses/Error'
  /roster/solve:
    post:
      operationId: solveRosterPlans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                goal_order:
                  type: array
                  minItems: 5
                  maxItems: 5
                  uniqueItems: true
                  items:
                    enum:
                      - hard_constraints
                      - graduation_progress
                      - minimal_change
                      - personal_preference
                      - minimal_gaps
                preferences:
                  type: object
                  additionalProperties: false
                  required: [time_of_day, compactness, variety, stability]
                  properties:
                    time_of_day: { enum: [morning, daytime, late] }
                    compactness: { type: integer, minimum: 0, maximum: 3 }
                    variety: { type: integer, minimum: 0, maximum: 3 }
                    stability: { type: integer, minimum: 0, maximum: 3 }
                solver_protocol:
                  const: conda_style_v1
      responses:
        '200':
          description: Ranked, explainable, non-formal semester plan candidates.
          content:
            application/json:
              schema:
                $ref: './roster-plans-response.schema.json'
        '422':
          $ref: '#/components/responses/Error'
  /roster/what-if:
    post:
      operationId: simulateRosterBranch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [branch_name]
              properties:
                branch_name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200':
          description: Named, explicitly simulated candidate branch.
          content:
            application/json:
              schema:
                $ref: './roster-plans-response.schema.json'
        '422':
          $ref: '#/components/responses/Error'
  /roster/plans/{plan_id}/diff:
    get:
      operationId: getRosterPlanTransaction
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Add/drop/swap preview and required formal follow-up steps.
        '404':
          $ref: '#/components/responses/Error'
  /roster/plans/{plan_id}/lock:
    post:
      operationId: saveRosterSemesterLock
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Replayable, explicitly non-formal fixture plan lock.
          content:
            application/json:
              schema:
                $ref: './semester-lock.schema.json'
        '404':
          $ref: '#/components/responses/Error'
  /roster/catalog:
    get:
      operationId: getRosterCatalog
      responses:
        '200':
          description: Sanitized, versioned fixture course catalog and source boundary.
  /roster/import-capabilities:
    get:
      operationId: getRosterImportCapabilities
      description: >-
        Reports the only accepted UArizona and HEBUT catalog scopes and the
        validation-only boundary. It does not report a real catalog as imported.
      responses:
        '200':
          description: Catalog gates and the current Conda-style solver protocol.
  /roster/imports/validate:
    post:
      operationId: validateRosterCatalogImport
      description: >-
        Validates a bounded course-catalog metadata batch. It never persists
        records, imports enrollment data, reserves seats, or changes formal enrollment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './roster-catalog-import-request.schema.json'
      responses:
        '200':
          description: Validation-only receipt requiring explicit human promotion.
          content:
            application/json:
              schema:
                $ref: './roster-catalog-import-receipt.schema.json'
        '422':
          $ref: '#/components/responses/Error'
  /roster/unsat:
    get:
      operationId: getRosterUnsatisfiableExplanation
      responses:
        '200':
          description: Minimal conflict set, blocking chain, and safe relaxation candidates.
  /demo/roster:
    get:
      operationId: getDemoRoster
      responses:
        '200':
          description: Complete, explicitly non-formal F-004 fixture.
          content:
            application/json:
              schema:
                $ref: './roster-fixture.schema.json'
  /demo/roster/reset:
    post:
      operationId: resetDemoRoster
      responses:
        '200':
          description: Reset only the in-memory Roster Lab fixture session for repeatable local QA.
  /mirror/sources:
    get:
      operationId: listMirrorSources
      responses:
        '200':
          description: Purpose-scoped, authorized source registry. No school passwords are accepted.
    post:
      operationId: registerMirrorSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [name, system_type, responsible_party, field_scope, correction_route]
              properties:
                name: { type: string, minLength: 1 }
                system_type:
                  enum: [sis, urp, lms, manual_export, demo_fixture]
                responsible_party: { type: string, minLength: 1 }
                field_scope:
                  type: array
                  minItems: 1
                  items: { type: string, minLength: 1 }
                correction_route: { type: string, minLength: 1 }
      responses:
        '201':
          description: Local, authorized source registration; never a credential collection receipt.
        '422':
          $ref: '#/components/responses/Error'
  /mirror/sources/{source_id}/sync:
    post:
      operationId: syncMirrorSource
      parameters:
        - $ref: '#/components/parameters/SourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode:
                  enum: [full, incremental]
      responses:
        '200':
          description: New immutable raw snapshot; the prior snapshot remains unchanged.
        '404':
          $ref: '#/components/responses/Error'
        '422':
          description: P1 rejects incremental mode and declares a full-sync fallback.
          content:
            application/json:
              schema:
                $ref: './error-response.schema.json'
  /mirror/snapshots:
    get:
      operationId: listMirrorSnapshots
      responses:
        '200':
          description: Immutable raw snapshot receipts with SHA-256 content hashes.
  /mirror/records:
    get:
      operationId: listMirrorRecords
      responses:
        '200':
          description: Read-only normalized records with field-level provenance.
          content:
            application/json:
              schema:
                $ref: './mirror-records-response.schema.json'
  /mirror/records/{record_id}/provenance:
    get:
      operationId: getMirrorRecordProvenance
      parameters:
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: Source, external field, version, fetch time, authority, conversion rule, and raw snapshot for every field.
        '404':
          $ref: '#/components/responses/Error'
  /mirror/records/{record_id}:
    delete:
      operationId: deleteNonAuthoritativeMirrorCopy
      parameters:
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: Removes only a user-controlled non-authoritative mirror copy.
        '404':
          $ref: '#/components/responses/Error'
        '422':
          description: Authoritative and official mirror copies cannot be deleted in the experience layer.
          content:
            application/json:
              schema:
                $ref: './error-response.schema.json'
  /mirror/conflicts:
    get:
      operationId: listMirrorConflicts
      responses:
        '200':
          description: Human review queue; competing values are never silently overwritten.
  /mirror/conflicts/{conflict_id}/resolve:
    put:
      operationId: resolveMirrorConflict
      parameters:
        - $ref: '#/components/parameters/ConflictId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [chosen_option_id, reason]
              properties:
                chosen_option_id: { type: string, minLength: 1 }
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: Human resolution receipt; no source-system write-back occurs.
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /mirror/consents:
    get:
      operationId: listMirrorConsents
      responses:
        '200':
          description: Purpose-bound consent records and revocation state.
    post:
      operationId: upsertMirrorConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './academic-mirror-fixture.schema.json#/$defs/consentRecord'
      responses:
        '200':
          description: Consent grant or revocation is appended to the audit chain.
        '422':
          $ref: '#/components/responses/Error'
  /mirror/corrections:
    post:
      operationId: requestMirrorCorrection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [record_id, reason]
              properties:
                record_id: { type: string, minLength: 1 }
                reason: { type: string, minLength: 1 }
      responses:
        '202':
          description: Adds a human review request without changing the formal record.
        '422':
          $ref: '#/components/responses/Error'
  /mirror/exports:
    post:
      operationId: exportPersonalMirror
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [archive_type]
              properties:
                archive_type:
                  enum:
                    [readable_untrusted, trusted_archive_contract_fixture]
      responses:
        '200':
          description: Portable non-authoritative copy or explicitly unsigned trusted-archive contract fixture.
          content:
            application/json:
              schema:
                $ref: './mirror-archive.schema.json'
        '422':
          $ref: '#/components/responses/Error'
  /mirror/audit:
    get:
      operationId: getMirrorAudit
      responses:
        '200':
          description: Append-only sync, map, review, consent, correction, deletion, and export events.
  /demo/mirror:
    get:
      operationId: getDemoMirror
      responses:
        '200':
          description: Complete, explicitly read-only F-003 fixture.
          content:
            application/json:
              schema:
                $ref: './academic-mirror-fixture.schema.json'
  /demo/mirror/reset:
    post:
      operationId: resetDemoMirror
      responses:
        '200':
          description: Reset only the in-memory Academic Mirror fixture session for repeatable local QA.
  /performance/dashboard:
    get:
      operationId: getPerformanceDashboard
      responses:
        '200':
          description: >-
            Private self-only metrics, observations, ability dimensions,
            support routes, evidence, deferred research gate, and mutable
            fixture session.
  /performance/metrics:
    get:
      operationId: getPerformanceMetrics
      responses:
        '200':
          description: Versioned metric definitions, limits, correction routes, and observations.
  /performance/evidence/{evidence_id}:
    get:
      operationId: getPerformanceEvidence
      parameters:
        - $ref: '#/components/parameters/PerformanceEvidenceId'
      responses:
        '200':
          description: One declared evidence record with locator, authority, and freshness.
          content:
            application/json:
              schema:
                $ref: './performance-center-fixture.schema.json#/$defs/evidence'
        '404':
          $ref: '#/components/responses/Error'
  /performance/recommendations:
    get:
      operationId: getPerformanceRecommendations
      responses:
        '200':
          description: Transparent rule-fixture recommendations and current student choices.
  /performance/recommendations/{recommendation_id}:
    put:
      operationId: choosePerformanceRecommendation
      parameters:
        - $ref: '#/components/parameters/PerformanceRecommendationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  enum: [adopted, later, dismissed]
      responses:
        '200':
          description: Records the student's reversible choice without formal write-back.
          content:
            application/json:
              schema:
                $ref: './performance-center-fixture.schema.json#/$defs/recommendation'
        '422':
          $ref: '#/components/responses/Error'
  /performance/climate:
    put:
      operationId: previewPerformanceClimateVariant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [variant]
              properties:
                variant:
                  enum: [a_numbers, b_words, c_dimensions]
      responses:
        '200':
          description: >-
            Switches a local A/B/C research preview. The human-evidence gate
            remains deferred and C is the safe default.
          content:
            application/json:
              schema:
                $ref: './performance-center-session.schema.json'
        '422':
          $ref: '#/components/responses/Error'
  /performance/shares:
    post:
      operationId: createPerformanceShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipient, purpose, duration_days, dimension_ids]
              properties:
                recipient: { type: string, minLength: 1 }
                purpose: { type: string, minLength: 1 }
                duration_days:
                  type: integer
                  minimum: 1
                  maximum: 30
                dimension_ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    enum:
                      - ability-knowledge
                      - ability-applied
                      - ability-collaboration
                      - ability-habit
      responses:
        '201':
          description: Creates an expiring, purpose-bound fixture grant.
          content:
            application/json:
              schema:
                $ref: './performance-center-fixture.schema.json#/$defs/shareGrant'
        '422':
          $ref: '#/components/responses/Error'
  /performance/shares/{grant_id}:
    delete:
      operationId: revokePerformanceShare
      parameters:
        - $ref: '#/components/parameters/PerformanceGrantId'
      responses:
        '200':
          description: Immediately revokes the fixture grant and records a replay receipt.
          content:
            application/json:
              schema:
                $ref: './performance-center-fixture.schema.json#/$defs/shareGrant'
        '422':
          $ref: '#/components/responses/Error'
  /performance/corrections:
    post:
      operationId: requestPerformanceCorrection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_id, reason]
              properties:
                target_id: { type: string, minLength: 1 }
                reason: { type: string, minLength: 1 }
      responses:
        '202':
          description: Queues a human correction while preserving the old observation.
          content:
            application/json:
              schema:
                $ref: './performance-center-fixture.schema.json#/$defs/correction'
        '422':
          $ref: '#/components/responses/Error'
  /performance/harm-signals:
    post:
      operationId: reportPerformanceHarm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [description]
              properties:
                description: { type: string, minLength: 1 }
      responses:
        '202':
          description: >-
            Triggers the STOP gate, withdraws the status label, and returns to
            the no-metaphor C view.
          content:
            application/json:
              schema:
                $ref: './performance-center-fixture.schema.json#/$defs/harmSignal'
        '422':
          $ref: '#/components/responses/Error'
